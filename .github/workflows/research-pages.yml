name: Refresh research and publish preview
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: tarka-preview
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public research
        run: python scripts/crawl-research.py --output data/research-snapshot.json
      - name: Keep the latest scan
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research-snapshot.json
          git diff --cached --quiet || git commit -m 'Refresh public research sources'
          git push
      - name: Prepare static preview
        run: |
          mkdir _site
          cp index.html .nojekyll geist-font-license.txt _site/
          cp -r assets _site/
          cp data/research-snapshot.json _site/research-snapshot.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
